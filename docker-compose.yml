name: gracecare

x-pg-common: &pg-common
  image: postgres:16.4
  environment: &pg-env
    POSTGRES_USER: gc
    POSTGRES_PASSWORD: gc_local_only
    POSTGRES_DB: gracecare
    TZ: Africa/Lagos
    PGTZ: Africa/Lagos
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gc -d gracecare"]
    interval: 3s
    timeout: 3s
    retries: 40
  volumes:
    - ./:/portfolio:ro

services:
  # ---------------------------------------------------------------- PostgreSQL primary (Parts 1-3, 5)
  pg-primary:
    <<: *pg-common
    container_name: gc-pg-primary
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - timezone=Africa/Lagos
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=256MB
      - -c
      - cluster_name=primary
    ports: ["15432:5432"]
    volumes:
      - ./:/portfolio:ro
      - ./infra/postgres/primary-init:/docker-entrypoint-initdb.d:ro
      - pg_primary_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------- PostgreSQL streaming replica (Part 5)
  pg-replica:
    <<: *pg-common
    container_name: gc-pg-replica
    depends_on:
      pg-primary: { condition: service_healthy }
    entrypoint: ["bash", "/portfolio/infra/postgres/replica-entrypoint.sh"]
    ports: ["15433:5432"]
    volumes:
      - ./:/portfolio:ro
      - pg_replica_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------- MongoDB 3-node replica set (Parts 4-5)
  mongo1:
    image: mongo:7.0.14
    container_name: gc-mongo1
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]
    healthcheck: &mongo-health
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes: [mongo1_data:/data/db]
  mongo2:
    image: mongo:7.0.14
    container_name: gc-mongo2
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]
    healthcheck: *mongo-health
    volumes: [mongo2_data:/data/db]
  mongo3:
    image: mongo:7.0.14
    container_name: gc-mongo3
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "0.25",
      ]
    healthcheck: *mongo-health
    volumes: [mongo3_data:/data/db]

  # one-shot job: initiates the replica set (idempotent)
  mongo-init:
    image: mongo:7.0.14
    container_name: gc-mongo-init
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    volumes: [./infra/mongo:/scripts:ro]
    entrypoint:
      ["mongosh", "--host", "mongo1", "--quiet", "/scripts/init-replica-set.js"]
    restart: "no"

  # ---------------------------------------------------------------- Redis key-value store (Part 4)
  redis:
    image: redis:7.4.1-alpine
    container_name: gc-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- Citus distributed PostgreSQL (Part 5, profile "sharding")
  citus-coord:
    image: citusdata/citus:12.1.6
    container_name: gc-citus-coord
    profiles: ["sharding"]
    environment: &citus-env
      POSTGRES_USER: gc
      POSTGRES_PASSWORD: gc_local_only
      POSTGRES_DB: gracecare
      POSTGRES_HOST_AUTH_METHOD: trust # lab network only: lets the coordinator reach workers
      TZ: Africa/Lagos
    healthcheck: &citus-health
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gc -d gracecare"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes: [./:/portfolio:ro]
  citus-w1:
    image: citusdata/citus:12.1.6
    container_name: gc-citus-w1
    profiles: ["sharding"]
    environment: *citus-env
    healthcheck: *citus-health
  citus-w2:
    image: citusdata/citus:12.1.6
    container_name: gc-citus-w2
    profiles: ["sharding"]
    environment: *citus-env
    healthcheck: *citus-health

  # ---------------------------------------------------------------- Python tool container (runs Parts 2-4 scripts)
  tools:
    build: ./tools
    image: gracecare-tools:1.0
    container_name: gc-tools
    profiles: ["tools"]
    working_dir: /portfolio
    environment:
      PG_DSN: "host=pg-primary port=5432 dbname=gracecare user=gc password=gc_local_only"
      MONGO_URI: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      REDIS_URL: "redis://redis:6379/0"
      PYTHONPATH: /portfolio/tools
      PYTHONUNBUFFERED: "1"
    volumes: ["./:/portfolio"]

volumes:
  pg_primary_data:
  pg_replica_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
